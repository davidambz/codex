name: CI

on:
  push:
    branches: [main]
    # README.md files are the only .md tracked in git (see .gitignore's
    # "*.md" + "!README.md" rule); a push touching only those has nothing
    # for this job to verify.
    paths-ignore:
      - "**/README.md"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Node as the one bundled in Electron, so node:sqlite (with
      # FTS5) behaves in tests exactly as it does in the app.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
